<canvas id="matrix-rain" aria-hidden="true"></canvas>

<style>
  #matrix-rain {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
  }
</style>
<script>
(function () {
  var canvas = document.getElementById('matrix-rain');
  if (!canvas) return;

  var prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (prefersReducedMotion) return;

  var ctx = canvas.getContext('2d');
  var parent = canvas.parentElement;
  var columns, drops;
  var chars = 'アイウエオカキクケコサシスセソ0123456789ABDEF';
  var fontSize = 16;

  function resize() {
    canvas.width = parent.offsetWidth;
    canvas.height = parent.offsetHeight;
    columns = Math.floor(canvas.width / fontSize);
    drops = new Array(columns).fill(1);
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#00FF41';
    ctx.font = fontSize + 'px monospace';

    for (var i = 0; i < drops.length; i++) {
      var text = chars[Math.floor(Math.random() * chars.length)];
      var x = i * fontSize;
      var y = drops[i] * fontSize;

      ctx.save();
      ctx.translate(x, y);
      ctx.scale(0.6, 1);   // squeeze horizontally, leave height untouched
      ctx.fillText(text, 0, 0);
      ctx.restore();

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
}

  // Wait for full page load (layout settled) before first measuring
  window.addEventListener('load', function () {
    resize();
    setInterval(draw, 130);
  });

  window.addEventListener('resize', resize);
})();
</script>
